# El puerto se puede cambiar con la variable PORT (la usan Render y Railway).
server.port=${PORT:8081}

# Conexión a la base de datos MySQL (variables de entorno para producción).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/api_libreria}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}

# Secreto para firmar los tokens JWT (en producción se define con JWT_SECRET).
jwt.secret=${JWT_SECRET:api-libreria-sena-2026-clave-super-segura-para-firmar-los-tokens-de-jwt-321}
jwt.expiration=86400000

# Carpetas y orígenes permitidos se configuran desde variables de entorno.
uploads.dir=${UPLOADS_DIR:uploads}
cors.origins=${CORS_ORIGINS:http://localhost:5173}
